<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klocrix — Design Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&family=Outfit:wght@400;500;600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9e6e1;font-family:Inter,system-ui,sans-serif;color:#222}
.top{padding:36px 24px 8px;text-align:center}
.top h1{margin:0 0 8px;font:700 28px Inter}
.top p{margin:0;color:#555}
.pick{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:18px 24px 6px}
.pick a{background:#fff;border:1px solid #ccc;border-radius:999px;padding:9px 18px;font-weight:600;color:#222;text-decoration:none;font-size:14px}
.board{max-width:1180px;margin:28px auto;border-radius:22px;overflow:hidden;box-shadow:0 20px 50px -20px rgba(0,0,0,.35);background:var(--bg);color:var(--tx);font-family:var(--body)}
.label{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;background:#111;color:#fff;padding:12px 22px;font:600 14px Inter}
.label span{opacity:.75;font-weight:400}
nav{display:flex;justify-content:space-between;align-items:center;padding:22px 44px;background:var(--navbg);border-bottom:1px solid var(--line)}
.logo{height:46px;filter:var(--logofilter)}
nav ul{display:flex;gap:26px;list-style:none;margin:0;padding:0;font-weight:500;font-size:15px}
.btn{display:inline-block;padding:14px 26px;border-radius:var(--rad);font-weight:600;font-size:15px;text-decoration:none;border:0}
.b1{background:var(--ac);color:var(--onac)}
.b2{border:1.5px solid var(--tx);color:var(--tx)}
.hero{padding:76px 44px 64px;display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:center;background:var(--herobg)}
.hero h2{font-family:var(--head);font-weight:var(--hw);font-size:62px;line-height:1.04;letter-spacing:var(--ls);margin:0 0 20px;color:var(--hc)}
.hero p{font-size:18px;line-height:1.6;max-width:520px;color:var(--mut);margin:0 0 28px}
.hero .ey{font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--ac);margin-bottom:16px}
.img{border-radius:var(--rad);aspect-ratio:4/5;background:url(/hero/team.webp) center/cover;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{padding:26px 44px;border-right:1px solid var(--line)}
.stats b{display:block;font:var(--hw) 38px var(--head);color:var(--hc)}
.stats span{color:var(--mut);font-size:14px}
.sec{padding:60px 44px}
.sec h3{font-family:var(--head);font-weight:var(--hw);font-size:36px;letter-spacing:var(--ls);margin:0 0 28px;color:var(--hc)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:26px}
.card i{display:block;width:44px;height:44px;border-radius:calc(var(--rad)/1.6);background:var(--ac);margin-bottom:18px}
.card h4{margin:0 0 8px;font:var(--hw) 20px var(--head);color:var(--hc)}
.card p{margin:0;color:var(--mut);line-height:1.55;font-size:15px}
.sw{display:flex;gap:0;margin:0 44px 36px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.sw div{flex:1;padding:16px 10px;font-size:12px;text-align:center}
@media(max-width:860px){.hero,.cards,.stats{grid-template-columns:1fr}nav ul{display:none}.hero h2{font-size:42px}.sec,.hero,nav{padding-left:20px;padding-right:20px}}

/* A — Clean light */
#a{--bg:#FFFFFF;--navbg:#fff;--herobg:#FFF8F5;--tx:#14213D;--hc:#14213D;--mut:#5b6577;--line:#E7E9EE;--card:#fff;--ac:#E8392A;--onac:#fff;--rad:14px;--head:'Plus Jakarta Sans';--body:'Plus Jakarta Sans';--hw:800;--ls:-.03em;--logofilter:none}
/* B — Midnight navy */
#b{--bg:#0A1020;--navbg:#0A1020;--herobg:radial-gradient(900px 400px at 80% 0,#16306b 0,transparent 70%),#0A1020;--tx:#E8EEFB;--hc:#fff;--mut:#9fb0d0;--line:#1c2a4a;--card:#101a33;--ac:#3D7BFF;--onac:#fff;--rad:12px;--head:'Space Grotesk';--body:Inter;--hw:700;--ls:-.03em;--logofilter:none}
/* C — Warm editorial */
#c{--bg:#F6F1E9;--navbg:#F6F1E9;--herobg:#F6F1E9;--tx:#1B1612;--hc:#1B1612;--mut:#6a5f55;--line:#DDD3C5;--card:#FBF8F3;--ac:#C8321F;--onac:#fff;--rad:4px;--head:'Fraunces';--body:'DM Sans';--hw:600;--ls:-.02em;--logofilter:invert(1) brightness(.2)}
/* D — Bold brand red */
#d{--bg:#fff;--navbg:#E8392A;--herobg:#E8392A;--tx:#fff;--hc:#fff;--mut:rgba(255,255,255,.88);--line:rgba(255,255,255,.28);--card:#fff;--ac:#14110F;--onac:#fff;--rad:22px;--head:'Outfit';--body:'Poppins';--hw:700;--ls:-.02em;--logofilter:none}
#d .b2{border-color:#fff;color:#fff}
#d .hero .ey{color:#FFE2B0}
#d .stats{background:#14110F}
#d .stats b{color:#fff}#d .stats span{color:#bbb}#d .stats div{border-color:#2a2623}
#d .sec{background:#fff;color:#14110F}
#d .sec h3{color:#14110F}
#d .card{background:#FFF3F0;border-color:#F6D5CE}
#d .card h4{color:#14110F}#d .card p{color:#5a4f4a}
#d .card i{background:#E8392A}
#d nav{border-color:rgba(255,255,255,.25)}
#d .sw{border-color:#ddd}
</style>
</head>
<body>
<div class="top"><h1>Pick a design direction for Klocrix</h1><p>Same content, four different fonts and colour systems. Tell me the letter you like (or mix: e.g. “A colours with C fonts”).</p></div>
<div class="pick"><a href="#a">A · Clean Light</a><a href="#b">B · Midnight Navy</a><a href="#c">C · Warm Editorial</a><a href="#d">D · Bold Brand Red</a></div>
<div id="root"></div>
<script>
const T=[
 {id:'a',n:'A · Clean Light',d:'Trustworthy, corporate, very readable. White space + one red accent from your logo.',f:'Plus Jakarta Sans (headings + body)',sw:[['#FFFFFF','#14213D','White'],['#FFF8F5','#14213D','Blush'],['#14213D','#fff','Navy text'],['#E8392A','#fff','Logo red'],['#E7E9EE','#14213D','Line']],
  logo:'/klocrix-logo.png'},
 {id:'b',n:'B · Midnight Navy',d:'Modern tech / SaaS look. Dark navy with electric blue; red kept only for small highlights.',f:'Space Grotesk (headings) + Inter (body)',sw:[['#0A1020','#fff','Midnight'],['#101A33','#fff','Card'],['#E8EEFB','#0A1020','Text'],['#3D7BFF','#fff','Blue'],['#E8392A','#fff','Logo red']],
  logo:'/klocrix-logo-white.png'},
 {id:'c',n:'C · Warm Editorial',d:'Premium agency feel. Cream paper, near-black text, serif headlines, sharp corners.',f:'Fraunces serif (headings) + DM Sans (body)',sw:[['#F6F1E9','#1B1612','Paper'],['#FBF8F3','#1B1612','Card'],['#1B1612','#fff','Ink'],['#C8321F','#fff','Brick red'],['#DDD3C5','#1B1612','Line']],
  logo:'/klocrix-logo.png'},
 {id:'d',n:'D · Bold Brand Red',d:'Energetic and brand-led. Solid logo red hero, black buttons, big rounded shapes.',f:'Outfit (headings) + Poppins (body)',sw:[['#E8392A','#fff','Logo red'],['#14110F','#fff','Black'],['#FFFFFF','#14110F','White'],['#FFF3F0','#14110F','Tint'],['#FFE2B0','#14110F','Sand']],
  logo:'/klocrix-logo-white.png'}
];
const svc=[['Web Development','Scalable, high-performance web applications built with the latest frameworks like React and Next.js.'],['App Development','Native and cross-platform mobile solutions that provide seamless experiences across all devices.'],['UI/UX Design','User-centric design thinking that combines aesthetic beauty with functional excellence.']];
document.getElementById('root').innerHTML=T.map(t=>`
<section class="board" id="${t.id}">
  <div class="label">${t.n}<span>${t.f}</span></div>
  <nav><img class="logo" src="${t.logo}" alt="Klocrix"><ul><li>Home</li><li>About</li><li>Services</li><li>Work</li><li>Training</li><li>Contact</li></ul><a class="btn b1" href="#">Start Project</a></nav>
  <div class="hero">
    <div><div class="ey">Empowering the Future of Business</div>
      <h2>Transforming Businesses with Scalable IT Solutions.</h2>
      <p>We empower ambitious companies with cutting-edge technology, strategic consulting, and bespoke software that drives real-world growth.</p>
      <a class="btn b1" href="#">Start Project</a> &nbsp; <a class="btn b2" href="#">Our Capabilities</a></div>
    <div class="img"></div>
  </div>
  <div class="stats"><div><b>2019</b><span>Founded</span></div><div><b>5+</b><span>Years of delivery</span></div><div><b>30+</b><span>Countries reached</span></div><div><b>6</b><span>Service lines</span></div></div>
  <div class="sec"><h3>Comprehensive IT Solutions for Modern Enterprises</h3>
    <div class="cards">${svc.map(s=>`<div class="card"><i></i><h4>${s[0]}</h4><p>${s[1]}</p></div>`).join('')}</div></div>
  <div class="sec" style="padding-top:0"><p style="margin:0 0 12px;font-size:14px;color:var(--mut)">${t.d}</p></div>
  <div class="sw">${t.sw.map(s=>`<div style="background:${s[0]};color:${s[1]}"><b>${s[2]}</b><br>${s[0]}</div>`).join('')}</div>
</section>`).join('');
</script>
</body>
</html>
